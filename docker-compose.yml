version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# FlowForge — Local Development Docker Compose
#
# Only application processes run here.
# PostgreSQL and Redis are Azure-managed services accessed via DATABASE_URL
# and REDIS_URL environment variables (loaded from .env).
#
# Usage:
#   docker compose up              # start api + 1 worker
#   docker compose up --scale worker=3   # start api + 3 workers
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    # Scale with: docker compose up --scale worker=N
    depends_on:
      api:
        condition: service_healthy
