name: Deploy FlowForge to Azure

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sanitize and Export Azure Secrets
        env:
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_RG_NAME: ${{ secrets.AZURE_RG_NAME }}
          AZURE_API_APP_NAME: ${{ secrets.AZURE_API_APP_NAME }}
          AZURE_WORKER_APP_NAME: ${{ secrets.AZURE_WORKER_APP_NAME }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          echo "AZ_ACR_NAME=$(echo "$AZURE_ACR_NAME" | tr -d '\r\n')" >> $GITHUB_ENV
          echo "AZ_RG_NAME=$(echo "$AZURE_RG_NAME" | tr -d '\r\n')" >> $GITHUB_ENV
          echo "AZ_API_APP_NAME=$(echo "$AZURE_API_APP_NAME" | tr -d '\r\n')" >> $GITHUB_ENV
          echo "AZ_WORKER_APP_NAME=$(echo "$AZURE_WORKER_APP_NAME" | tr -d '\r\n')" >> $GITHUB_ENV
          echo "VITE_CLERK_PUBLISHABLE_KEY=$(echo "$VITE_CLERK_PUBLISHABLE_KEY" | tr -d '\r\n')" >> $GITHUB_ENV

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "$AZ_ACR_NAME"

      - name: Build and Push API Image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$AZ_ACR_NAME" --query "loginServer" -o tsv | tr -d '\r\n')
          docker build -t "$ACR_LOGIN_SERVER/flowforge-api:${{ github.sha }}" -t "$ACR_LOGIN_SERVER/flowforge-api:latest" -f packages/api/Dockerfile .
          docker push "$ACR_LOGIN_SERVER/flowforge-api:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/flowforge-api:latest"

      - name: Build and Push Worker Image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$AZ_ACR_NAME" --query "loginServer" -o tsv | tr -d '\r\n')
          docker build -t "$ACR_LOGIN_SERVER/flowforge-worker:${{ github.sha }}" -t "$ACR_LOGIN_SERVER/flowforge-worker:latest" -f packages/worker/Dockerfile .
          docker push "$ACR_LOGIN_SERVER/flowforge-worker:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/flowforge-worker:latest"

      - name: Update Azure Container Apps
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$AZ_ACR_NAME" --query "loginServer" -o tsv | tr -d '\r\n')
          
          # 1. Update API container app secrets & environment variables
          if [ -n "$RESEND_API_KEY" ]; then
            az containerapp secret set --name "$AZ_API_APP_NAME" --resource-group "$AZ_RG_NAME" --secrets "resend-api-key=$RESEND_API_KEY"
            az containerapp update --name "$AZ_API_APP_NAME" --resource-group "$AZ_RG_NAME" \
              --image "$ACR_LOGIN_SERVER/flowforge-api:${{ github.sha }}" \
              --set-env-vars "RESEND_API_KEY=secretref:resend-api-key" "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL"
          else
            az containerapp update --name "$AZ_API_APP_NAME" --resource-group "$AZ_RG_NAME" \
              --image "$ACR_LOGIN_SERVER/flowforge-api:${{ github.sha }}"
          fi

          # 2. Update Worker container app secrets & environment variables
          if [ -n "$RESEND_API_KEY" ]; then
            az containerapp secret set --name "$AZ_WORKER_APP_NAME" --resource-group "$AZ_RG_NAME" --secrets "resend-api-key=$RESEND_API_KEY"
            az containerapp update --name "$AZ_WORKER_APP_NAME" --resource-group "$AZ_RG_NAME" \
              --image "$ACR_LOGIN_SERVER/flowforge-worker:${{ github.sha }}" \
              --set-env-vars "RESEND_API_KEY=secretref:resend-api-key" "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL"
          else
            az containerapp update --name "$AZ_WORKER_APP_NAME" --resource-group "$AZ_RG_NAME" \
              --image "$ACR_LOGIN_SERVER/flowforge-worker:${{ github.sha }}"
          fi

      - name: Fetch API URL
        id: fetch-api-url
        run: |
          API_URL=$(az containerapp show --name "$AZ_API_APP_NAME" --resource-group "$AZ_RG_NAME" --query "properties.configuration.ingress.fqdn" -o tsv | tr -d '\r\n')
          echo "api_url=https://$API_URL" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies & Build Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || steps.fetch-api-url.outputs.api_url }}
        run: |
          npm ci
          npm run build --workspace=packages/dashboard

      - name: Deploy Frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "packages/dashboard/dist"
          skip_app_build: true
